name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  persona-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: persona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d persona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check persona ownership and limits in disposable Postgres
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d persona_test -v ON_ERROR_STOP=1
          -f tests/sql/bootstrap.sql
          -f supabase/migrations/202610060001_personas.sql
          -f tests/sql/personas-isolation.sql
